name: Farmwell production backup

on:
  workflow_dispatch:
    inputs:
      restore_drill:
        description: Download the new R2 archive and restore it into an isolated database
        type: boolean
        default: false
  schedule:
    - cron: '47 1 * * *'
    - cron: '47 13 * * *'

permissions:
  contents: read

concurrency:
  group: farmwell-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: production-backups
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # CI-verified revision with the Supabase backup and restore profile.
          ref: ffd97a6ee83afb483a8597bc85fec40e2f81c1b9
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.5'
          extensions: zip, pdo_pgsql, gd, exif
      - run: composer install --no-dev --no-interaction --prefer-dist
      - name: Check the age of the latest archive independently of the backup run
        if: github.event.schedule == '47 13 * * *'
        env:
          CACHE_STORE: array
          FARMWELL_BACKUP_DISK: r2
          BACKUP_R2_ENDPOINT: ${{ vars.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: php artisan backup:monitor --no-interaction
      - name: Install PostgreSQL 18 backup and restore tools
        if: github.event.schedule != '47 13 * * *'
        run: bash .github/scripts/setup-backup-postgres.sh
      - name: Install the Supabase database CA for hostname verification
        if: github.event.schedule != '47 13 * * *'
        env:
          SUPABASE_CA_CERT: ${{ vars.SUPABASE_CA_CERT }}
        run: |
          test -n "$SUPABASE_CA_CERT"
          printf '%s\n' "$SUPABASE_CA_CERT" > "$RUNNER_TEMP/farmwell-postgres-ca.crt"
          openssl x509 -in "$RUNNER_TEMP/farmwell-postgres-ca.crt" -noout
      - name: Back up PostgreSQL and private uploads, check health and apply retention
        if: github.event.schedule != '47 13 * * *'
        env:
          CACHE_STORE: array
          FARMWELL_BACKUP_DISK: r2
          PGHOST: ${{ vars.SUPABASE_PGHOST }}
          PGDATABASE: postgres
          PGUSER: ${{ vars.SUPABASE_PGUSER }}
          PGPASSWORD: ${{ secrets.SUPABASE_PGPASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/farmwell-postgres-ca.crt
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT: ${{ vars.MEDIA_R2_ENDPOINT }}
          AWS_BUCKET: ${{ vars.MEDIA_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_ENDPOINT: ${{ vars.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_ARCHIVE_PASSWORD: ${{ secrets.BACKUP_ARCHIVE_PASSWORD }}
          FARMWELL_BACKUP_DATABASE_PROFILE: supabase
          FARMWELL_BACKUP_RESTORE_DRILL: ${{ inputs.restore_drill && 'true' || 'false' }}
        run: bash .github/scripts/farmwell-backup.sh
