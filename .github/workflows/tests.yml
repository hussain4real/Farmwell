name: tests

on:
  push:
    branches:
      - dev
      - stage
      - main
      - workos
  pull_request:
    branches:
      - dev
      - stage
      - main
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Test Client Behavior
        run: |
          npm run test:client
          node --experimental-strip-types --test tests/summary-polling.test.mjs
          node --experimental-strip-types --test tests/summary-review-text.test.mjs
          node --test tests/font-build.test.mjs

      - name: Install PostgreSQL 18 backup and restore tools
        run: bash .github/scripts/setup-backup-postgres.sh

      - name: Restore a synthetic encrypted staging backup
        run: |
          bash tests/backup-restore.sh
          bash tests/backup-restore.sh supabase

      - name: Rehearse a tenant-isolated pilot migration
        run: bash tests/team-migration.sh

      - name: Quality Gate
        run: composer ci:check

  queue-timeout-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build -t farmwell-queue-test .

      - name: Verify queue timeouts in the image
        run: |
          docker run --rm -i --entrypoint sh farmwell-queue-test \
            -c 'cat > /tmp/queue-timeout-image.php && php /tmp/queue-timeout-image.php' < tests/queue-timeout-image.php

      - name: Verify multipart upload limits in Apache
        run: |
          docker create --name farmwell-node-tool node:22-bookworm-slim
          docker cp farmwell-node-tool:/usr/local/bin/node "$RUNNER_TEMP/farmwell-test-node"
          docker rm farmwell-node-tool
          docker run --rm --network none -i \
            --mount "type=bind,src=$RUNNER_TEMP/farmwell-test-node,dst=/tmp/test-node,readonly" \
            --entrypoint /tmp/test-node farmwell-queue-test \
            --input-type=module < tests/upload-limits-image.mjs

  release-lint:
    if: github.repository == 'hussain4real/Farmwell' && github.event_name == 'push' && (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/lint.yml

  deploy:
    if: github.repository == 'hussain4real/Farmwell' && github.event_name == 'push' && (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main')
    needs: [ci, queue-timeout-image, release-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref_name == 'stage' && 'farmwell-staging' || 'farmwell-production' }}
    concurrency:
      group: farmwell-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check deployment opt-in
        id: enabled
        env:
          FARMWELL_CD_ENABLED: ${{ vars.FARMWELL_CD_ENABLED }}
        run: |
          if [[ "$FARMWELL_CD_ENABLED" == 'true' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Deployment is disabled in this environment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout the tested commit
        if: steps.enabled.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        if: steps.enabled.outputs.enabled == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the release Wrangler version
        if: steps.enabled.outputs.enabled == 'true'
        run: npm install --prefix "$RUNNER_TEMP/farmwell-wrangler" --no-audit --no-fund wrangler@4.169.0
      - name: Deploy and verify
        if: steps.enabled.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FARMWELL_CLOUDFLARE_API_TOKEN }}
          FARMWELL_ACCESS_CLIENT_ID: ${{ secrets.FARMWELL_ACCESS_CLIENT_ID }}
          FARMWELL_ACCESS_CLIENT_SECRET: ${{ secrets.FARMWELL_ACCESS_CLIENT_SECRET }}
        run: bash .github/scripts/deploy-farmwell.sh
