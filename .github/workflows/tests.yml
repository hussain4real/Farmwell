name: tests

on:
  push:
    branches:
      - dev
      - stage
      - main
      - workos
  pull_request:
    branches:
      - dev
      - stage
      - main
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Test Client Behavior
        run: |
          npm run test:client
          node --experimental-strip-types --test tests/summary-polling.test.mjs

      - name: Quality Gate
        run: composer ci:check

  queue-timeout-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build -t farmwell-queue-test .

      - name: Verify queue timeouts in the image
        run: |
          docker run --rm -i --entrypoint sh farmwell-queue-test \
            -c 'cat > /tmp/queue-timeout-image.php && php /tmp/queue-timeout-image.php' < tests/queue-timeout-image.php
