<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#1b4d3e" />
        <title>Offline - Farmwell</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #f6faf7;
                color: #13251e;
            }
            .card {
                width: 100%;
                max-width: 24rem;
                background: #ffffff;
                border: 1px solid #d5e4db;
                border-radius: 1rem;
                padding: 1.75rem;
                text-align: center;
                box-shadow: 0 10px 30px -15px rgba(27, 77, 62, 0.25);
            }
            .badge {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                border-radius: 9999px;
                background: #e6f4ed;
                color: #1b4d3e;
                font-size: 0.75rem;
                font-weight: 600;
            }
            h1 {
                margin: 1rem 0 0.5rem;
                font-size: 1.25rem;
            }
            p {
                margin: 0 0 1.25rem;
                font-size: 0.875rem;
                line-height: 1.5;
                color: #4f665c;
            }
            button {
                width: 100%;
                min-height: 2.75rem;
                border: 0;
                border-radius: 0.5rem;
                background: #1b4d3e;
                color: #ffffff;
                font-size: 0.9375rem;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <span class="badge">Offline Mode</span>
            <h1>You are currently offline</h1>
            <p>
                Farmwell could not reach the server. Once signal returns, tap retry — any daily logs already saved offline in your open session will sync automatically.
            </p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
